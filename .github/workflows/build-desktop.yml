name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish stable desktop-version.json release assets"
        required: true
        type: boolean
        default: false
      release_channel:
        description: "Release channel. Only stable can update desktop-latest."
        required: true
        type: choice
        default: qa
        options:
          - qa
          - stable

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64 desktop artifacts
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      has_signing_secrets: ${{ steps.signing.outputs.has_signing_secrets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck desktop and launcher
        run: pnpm exec turbo run typecheck --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Build desktop
        run: pnpm exec turbo run build --filter=@bb/desktop --output-logs=new-only

      - name: Test desktop and launcher
        run: pnpm exec turbo run test --filter=@bb/desktop --filter=bb-app --force --output-logs=new-only

      - name: Validate macOS signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          REQUIRED_SECRET_NAMES=(
            "MACOS_CERTIFICATE_P12"
            "MACOS_CERTIFICATE_PASSWORD"
            "APPLE_ID"
            "APPLE_APP_PASSWORD"
            "APPLE_TEAM_ID"
          )
          PRESENT_SECRET_NAMES=()
          MISSING_SECRET_NAMES=()

          for secret_name in "${REQUIRED_SECRET_NAMES[@]}"; do
            if [[ -n "${!secret_name:-}" ]]; then
              PRESENT_SECRET_NAMES+=("$secret_name")
            else
              MISSING_SECRET_NAMES+=("$secret_name")
            fi
          done

          HAS_SIGNING_SECRETS="false"
          if [[ "${#PRESENT_SECRET_NAMES[@]}" -eq 0 ]]; then
            echo "::warning::macOS signing/notarization secrets are not configured; building an ad-hoc-signed macOS artifact that stable releases publish with an unsigned-build warning."
          elif [[ "${#MISSING_SECRET_NAMES[@]}" -eq 0 ]]; then
            echo "macOS signing/notarization secrets are complete; signed and notarized artifacts will be produced."
            HAS_SIGNING_SECRETS="true"
          else
            echo "::error::Incomplete macOS signing/notarization secret set. Present: ${PRESENT_SECRET_NAMES[*]}. Missing: ${MISSING_SECRET_NAMES[*]}."
            exit 1
          fi

          echo "has_signing_secrets=$HAS_SIGNING_SECRETS" >> "$GITHUB_OUTPUT"

      - name: Package arm64 desktop artifacts
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec turbo run desktop:build --filter=@bb/desktop --force --output-logs=new-only

      - name: Smoke test packaged desktop app
        run: pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate desktop version feed
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Upload desktop workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axeai-desktop-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/desktop-version.json
          if-no-files-found: error

  linux:
    name: Linux x64 desktop artifacts
    # Pinned rather than ubuntu-latest so the glibc the AppImage links against
    # changes only when we choose it: the build machine's glibc sets the
    # minimum distro version users need.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install AppImage FUSE runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2

      - name: Typecheck desktop and launcher
        run: pnpm exec turbo run typecheck --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Build desktop
        run: pnpm exec turbo run build --filter=@bb/desktop --output-logs=new-only

      - name: Test desktop and launcher
        run: pnpm exec turbo run test --filter=@bb/desktop --filter=bb-app --force --output-logs=new-only

      - name: Package x64 AppImage
        # No --force: the packaging task is already cache: false, and forcing also
        # rebuilds its cached bb-app/@bb/desktop dependencies a second time.
        run: pnpm exec turbo run desktop:build:linux --filter=@bb/desktop --output-logs=new-only

      - name: Smoke test packaged desktop app
        # The packaged app opens a real BrowserWindow, so the headless runner
        # needs a virtual display.
        run: xvfb-run -a pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Smoke test AppImage mount lifecycle
        # Launches the generated AppImage itself, tears down only its GUI mount,
        # and verifies the separately mounted owned runtime remains healthy.
        run: xvfb-run -a pnpm exec turbo run smoke:appimage-lifecycle --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate desktop version feed
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Upload desktop workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axeai-desktop-linux-x64
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-linux.yml
            apps/desktop/release/desktop-version-linux.json
          if-no-files-found: error

  windows:
    name: Windows x64 desktop artifacts
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck desktop and launcher
        run: pnpm exec turbo run typecheck --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Build desktop
        run: pnpm exec turbo run build --filter=@bb/desktop --output-logs=new-only

      - name: Test desktop and launcher
        run: pnpm exec turbo run test --filter=@bb/desktop --filter=bb-app --force --output-logs=new-only

      - name: Package x64 NSIS installer
        run: pnpm exec turbo run desktop:build:windows --filter=@bb/desktop --output-logs=new-only

      - name: Smoke test packaged desktop app
        run: pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate desktop version feed
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Upload desktop workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axeai-desktop-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/desktop-version-windows.json
          if-no-files-found: error

  publish:
    name: Publish stable desktop release
    needs:
      - macos
      - linux
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The plan runs before the downloads: a qa or publish=false run has no use
      # for several hundred MB of binaries it will never upload.
      - name: Plan release publication
        id: release_plan
        env:
          HAS_SIGNING_SECRETS: ${{ needs.macos.outputs.has_signing_secrets }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          SHOULD_PUBLISH="false"
          if [[ "$INPUT_PUBLISH" == "true" && "$RELEASE_CHANNEL" == "stable" && "$IS_PRERELEASE" == "false" ]]; then
            SHOULD_PUBLISH="true"
          fi

          PUBLISH_MACOS_BINARIES="true"
          if [[ "$HAS_SIGNING_SECRETS" != "true" && "$SHOULD_PUBLISH" == "true" ]]; then
            echo "::warning::Apple Developer credentials are missing; publishing the ad-hoc-signed macOS build. Users will need to approve it in Privacy & Security."
          fi

          {
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "should_publish=$SHOULD_PUBLISH"
            echo "publish_macos_binaries=$PUBLISH_MACOS_BINARIES"
          } >> "$GITHUB_OUTPUT"

      - name: Download macOS desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: axeai-desktop-macos-arm64
          path: release/macos

      - name: Download Linux desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: axeai-desktop-linux-x64
          path: release/linux

      - name: Download Windows desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: axeai-desktop-windows-x64
          path: release/windows

      - name: Publish stable desktop release feed
        if: steps.release_plan.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_plan.outputs.version }}
          PUBLISH_MACOS_BINARIES: ${{ steps.release_plan.outputs.publish_macos_binaries }}
        run: |
          set -euo pipefail

          VERSION_TAG="desktop-v${VERSION}"
          LATEST_TAG="desktop-latest"
          MACOS_DIR="release/macos"
          LINUX_DIR="release/linux"
          WINDOWS_DIR="release/windows"

          RELEASE_ASSETS=()

          # An unmatched glob would otherwise reach gh as a literal pattern and
          # fail the upload, so each expansion states whether it is required.
          add_required_glob() {
            local matches=("$@")
            if [[ ! -e "${matches[0]}" ]]; then
              echo "::error::No release artifact matched ${matches[0]}."
              exit 1
            fi
            RELEASE_ASSETS+=("${matches[@]}")
          }

          add_optional_glob() {
            local matches=("$@")
            if [[ -e "${matches[0]}" ]]; then
              RELEASE_ASSETS+=("${matches[@]}")
            fi
          }

          # Both platforms reset the same moving release, so a single job
          # assembles every asset. Splitting the reset across platform jobs
          # would let whichever finished last delete the other's binaries.
          add_required_glob "$MACOS_DIR/desktop-version.json"
          add_required_glob "$LINUX_DIR/desktop-version-linux.json"
          add_required_glob "$LINUX_DIR/latest-linux.yml"
          add_required_glob "$LINUX_DIR"/*.AppImage
          # AppImage embeds its block map, so a sidecar file is not guaranteed.
          add_optional_glob "$LINUX_DIR"/*.blockmap
          add_required_glob "$WINDOWS_DIR/desktop-version-windows.json"
          add_required_glob "$WINDOWS_DIR/latest.yml"
          add_required_glob "$WINDOWS_DIR"/*.exe
          add_required_glob "$WINDOWS_DIR"/*.blockmap

          if [[ "$PUBLISH_MACOS_BINARIES" == "true" ]]; then
            add_required_glob "$MACOS_DIR/latest-mac.yml"
            add_required_glob "$MACOS_DIR"/*.dmg
            add_required_glob "$MACOS_DIR"/*.zip
            add_required_glob "$MACOS_DIR"/*.blockmap
          else
            echo "macOS binary publication is disabled for this run."
          fi

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Release $VERSION_TAG already exists; refusing to mutate immutable desktop release."
            exit 1
          fi

          gh release create "$VERSION_TAG" "${RELEASE_ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "AxeAI Desktop ${VERSION}" \
            --notes "AxeAI Desktop ${VERSION}. The macOS build is ad-hoc signed until Apple Developer signing is configured and may require approval in Privacy & Security." \
            --latest

          git tag -f "$LATEST_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/${LATEST_TAG}"

          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            gh release edit "$LATEST_TAG" \
              --target "$GITHUB_SHA" \
              --title "AxeAI Desktop latest" \
              --notes "Latest stable AxeAI Desktop release metadata." \
              --latest=false

            # desktop-latest is a moving release, but --clobber only replaces
            # assets with matching names. Preserve the release page and reset
            # assets in-place so versioned binaries cannot accumulate and
            # JSON-only publishes cannot leave stale binaries from an older
            # signed release.
            gh release view "$LATEST_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset_name; do
              if [[ -n "$asset_name" ]]; then
                gh release delete-asset "$LATEST_TAG" "$asset_name" --yes
              fi
            done

            gh release upload "$LATEST_TAG" "${RELEASE_ASSETS[@]}"
          else
            gh release create "$LATEST_TAG" "${RELEASE_ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "AxeAI Desktop latest" \
              --notes "Latest stable AxeAI Desktop release metadata." \
              --latest=false
          fi

      - name: Verify published desktop release
        if: steps.release_plan.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.release_plan.outputs.version }}
        run: |
          set -euo pipefail

          RELEASE_BASE="https://github.com/amitbtcai/axeai-macos/releases/download/desktop-latest"
          verify_feed() {
            local feed_name="$1"
            local expected_suffix="$2"
            local feed
            local published_version
            local asset_name

            feed="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$RELEASE_BASE/$feed_name")"
            published_version="$(jq -r '.version' <<<"$feed")"
            asset_name="$(jq -r --arg suffix "$expected_suffix" '.files[] | select(.url | endswith($suffix)) | .url' <<<"$feed" | head -n 1)"

            if [[ "$published_version" != "$VERSION" ]]; then
              echo "::error::$feed_name reports $published_version; expected $VERSION."
              exit 1
            fi
            if [[ -z "$asset_name" ]]; then
              echo "::error::$feed_name has no $expected_suffix installer."
              exit 1
            fi

            curl --fail --silent --show-error --location --head --retry 5 --retry-delay 2 "$RELEASE_BASE/$asset_name" >/dev/null
            echo "Verified $feed_name -> $asset_name"
          }

          verify_feed desktop-version.json .dmg
          verify_feed desktop-version-linux.json .AppImage
          verify_feed desktop-version-windows.json .exe

      - name: Summarize
        env:
          IS_PRERELEASE: ${{ steps.release_plan.outputs.is_prerelease }}
          PUBLISH_MACOS_BINARIES: ${{ steps.release_plan.outputs.publish_macos_binaries }}
          SHOULD_PUBLISH: ${{ steps.release_plan.outputs.should_publish }}
          VERSION: ${{ steps.release_plan.outputs.version }}
        run: |
          {
            echo "## AxeAI Desktop artifacts"
            echo
            echo "- arm64 macOS .dmg, .zip, latest-mac.yml, and desktop-version.json uploaded as workflow artifacts"
            echo "- x64 Linux .AppImage, latest-linux.yml, and desktop-version-linux.json uploaded as workflow artifacts"
            echo "- x64 Windows .exe, latest.yml, and desktop-version-windows.json uploaded as workflow artifacts"
            echo "- version: ${VERSION}"
            echo "- prerelease version: ${IS_PRERELEASE}"
            echo "- stable release publication requested and allowed: ${SHOULD_PUBLISH}"
            echo "- macOS release binary upload enabled: ${PUBLISH_MACOS_BINARIES}"
            echo "- macOS feed URL: https://github.com/amitbtcai/axeai-macos/releases/download/desktop-latest/desktop-version.json"
            echo "- Linux feed URL: https://github.com/amitbtcai/axeai-macos/releases/download/desktop-latest/desktop-version-linux.json"
            echo "- Windows feed URL: https://github.com/amitbtcai/axeai-macos/releases/download/desktop-latest/desktop-version-windows.json"
          } >> "$GITHUB_STEP_SUMMARY"
